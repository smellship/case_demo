id: manual-entry-used-car
title: 影像·采集发票 手工录入 数电纸质发票（二手车销售统一发票）
priority: P1
tags: [影像, 采集发票, 手工录入]
env: bw-test
notes: |
  用户给的 Playwright+midscene 脚本翻成内核用例（references/porting.md）。

  四个坑（全部实测）：
  1. 入口是 wujie 应用：登录后停在云控制台不回跳，第 2 步用步骤级站内路径导回来。
  2. 「发票类型」是自绘下拉（div.b-select，无 role），要 CLICK 开、再 CLICK 选项；
     选项在可滚动弹层里，内核点前会 scrollIntoView，不用管。
  3. **填完「发票代码」会把「发票类型」清回「请选择」**，所以必须在填完代码/号码之后
     再选一次类型，否则保存时页面报「发票类型不能为空」。这也是本用例把「选类型」拆成
     第 3、5 两步的原因。
  4. 「不含税金额」是必填（用户原脚本没填），不填保存必被拦。
  5. 第 7 步刻意**只断言号码出现在页面上**（`text_contains`），不加 element_value：
     - 首次保存成功：列表出现这一行，号码在行里；但表单被清空，输入框里已经没有号码；
     - 重复跑被拒：页面提示「该发票【…】已被…采集，请勿重复采集！」，号码同样在页面。
     所以只能认 page.text 里的号码；加 `element_value: 发票号码|…` 只有「被拒」那条成立。
  6. 号码用的是**已经入库过**的那张票：每轮保存都被拒、页面回显号码，用例因此可以反复跑。
     换成从没采过的号会真存成功、列表出行，第 8 步就得真删——而删除入口当前点不到：
     行右侧「更多」（span.render-box-icon）要 HOVER 才展开，展开出的「删除」是
     span.bwbutton-drop-text，点它即删、无二次确认；但「更多」在表格横向溢出列里
     （x≈3209 > 视口 1920），**快照只收视口内元素，内核看不到也点不到它**。
     第 8 步的能力留着（悬停更多 → 点删除），但常态靠「列表本来就没行」达成终态：
     - 重复跑被拒 → 本来就没行 → 直接完成，列表「暂无数据」；
     - 首次采集成功 → 有行 → 尝试悬停更多（不可达）→ 停在有行状态，判为未完成。
steps:
  - goal: 打开入口。若出现登录页，就用给定账号密码登录；否则已在登录态，直接进下一步
    checks:
      - text_contains: 云控制台
  - goal: 回到手工录入页
    url: /bw-main-ui/pictureProAlone-ui/picturePro/myNoteAdd
    checks:
      - element_exists: 发票代码
      - element_exists: 保存
  - goal: 在「发票类型」下拉里选「增值税专用发票」
    checks:
      - element_value: 发票类型|增值税专用发票
  - goal: 在「发票代码」「发票号码」两个输入框里填入给定值
    checks:
      - element_value: 发票代码|3200184130
      - element_value: 发票号码|70747171
  - goal: 填完代码后发票类型被清空了，重新在「发票类型」下拉里选「增值税专用发票」
    checks:
      - element_value: 发票类型|增值税专用发票
  - goal: 在「不含税金额」「开票日期」两个输入框里填入给定值；日期填完按 Escape 关掉日历
    checks:
      - element_value: 不含税金额|92920.35
      - element_value: 开票日期|2025-05-07
  - goal: 点「保存」，确认这张票被站点受理（出现行，或提示已采集过）
    checks:
      - text_contains: 70747171
  - goal: 清掉刚采集的这一行：列表里如果有这一行，就悬停它右侧的「更多」等「删除」出现再点它；如果列表本来就是空的（这张票之前已采集过），直接完成
    checks:
      - text_contains: 暂无数据
