id: invoice-check-84
title: 进项·发票查验 84 数电二手车
priority: P1
tags: [进项, 发票查验]
env: bw-test

notes: |
  入口地址不在用例里，运行时用 --url 给：
  http://10.100.3.2/bw-main-ui/incomeAlone-ui/income/invoiceCheck
  已登录时不需要账号密码；三个字段值用 --var 注入（键名必须是控件标签的子串）：
  --var 发票号码=25152000000023214079 --var 合计=105000.00 --var 开票日期=2025-05-07
  注意金额那格：标签先叫「金额合计」，填了值就变成「价税合计」，
  所以键必须用「合计」——它同时是两者的子串，用「金额合计」会匹配不上。
  页面是 wujie 微前端（主应用 bw-main-ui 套子应用 incomeAlone-ui），
  同一批 DOM 会同时出现在两个 frame 里；内核已按「主帧先扫、共用节点的帧跳过」处理。

steps:
  - goal: 打开入口。若出现登录页，就用给定账号密码登录；否则直接进入发票查验页
    checks:
      # 「发票查验」只是左侧菜单文本，不是可定位元素；用表单字段判断已到位
      - element_exists: 发票号码
      - element_exists: 开票日期
  - goal: 在「发票号码」「金额合计」「开票日期」三个输入框里填入给定值
    checks:
      - element_value: 发票号码|25152000000023214079
      - element_value: 开票日期|2025-05-07
  - goal: 点一下「备注」让日期框失焦，再点「查验」，等查验结果弹出
    checks:
      # 查验按钮在日期框失焦前是 disabled 的，所以这一步要先点别处再点查验
      - text_contains: 查验结果
      - text_contains: 数电票（二手车销售统一发票）
      - text_contains: 正常
